<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discord Knowledge Base | Guan Syun Su</title>
  
  <style>
    /* --- 核心 CSS 整合 --- */
    :root[data-theme="light"] {
      --primary: #5865F2;
      --background: #f0f2f5;
      --surface: #ffffff;
      --text: #2e3338;
      --card-border: #e3e5e8;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }
    :root[data-theme="dark"] {
      --primary: #5865F2;
      --background: #313338;
      --surface: #2b2d31;
      --text: #dbdee1;
      --card-border: #1e1f22;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    body {
      margin: 0;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background-color: var(--background);
      color: var(--text);
      transition: background 0.3s;
    }

    .nav {
      background: var(--surface);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
    }

    .brand .name { font-weight: 800; color: var(--primary); }

    /* 容器排版 */
    .discord-intro-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 24px 150px 24px; /* 底部墊高避免被輸入框擋住內容 */
    }

    /* 訊息進場動畫 */
    @keyframes messageSlideIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .message-block {
      display: flex;
      gap: 16px;
      margin-bottom: 30px;
      opacity: 0; 
      animation: messageSlideIn 0.6s ease-out forwards;
    }

    /* 初始訊息的延遲效果 */
    .delay-1 { animation-delay: 0.2s; }
    .delay-2 { animation-delay: 1.0s; }
    .delay-3 { animation-delay: 1.8s; }
    .delay-4 { animation-delay: 2.6s; }

    .message-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      flex-shrink: 0;
      object-fit: cover;
    }

    .message-content {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 0 16px 16px 16px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
      width: 100%;
    }

    .message-header { font-weight: 800; color: var(--primary); margin-bottom: 4px; font-size: 1rem; }
    .message-text { line-height: 1.7; word-break: break-all; }

    /* 底部固定輸入框 */
    .chat-input-wrapper {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 752px;
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      z-index: 99;
    }

    .chat-input {
      flex: 1;
      border: none;
      background: var(--background);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      outline: none;
      font-size: 1rem;
    }

    .send-btn {
      background: #5865F2;
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .send-btn:hover { background: #4752c4; }

    .back-nav {
      margin-top: 40px;
      display: inline-block;
      text-decoration: none;
      color: var(--ghost-btn);
    }
  </style>
</head>
<body>

  <header class="nav">
    <div class="container nav-inner">
      <div class="brand"><div class="name">Discord 工作群</div></div>
      <a href="index.html" style="text-decoration:none; color:var(--text); font-size: 0.9rem;">← 返回首頁</a>
    </div>
  </header>

  <main>
    <div class="discord-intro-container" id="chatArea">
      
      <div class="message-block delay-1">
        <img src="suphoto/colinsu-photo.jpg" class="message-avatar">
        <div class="message-content">
          <div class="message-header">Guan Syun Su</div>
          <div class="message-text">歡迎來到我的頻道！這是一個交流與保存資訊的 Discord 社群。</div>
        </div>
      </div>

      <div class="message-block delay-2">
        <img src="suphoto/colinsu-photo.jpg" class="message-avatar">
        <div class="message-content">
          <div class="message-header">Guan Syun Su</div>
          <div class="message-text">裡面有課程與考試的筆記。</div>
        </div>
      </div>

      <div class="message-block delay-3">
        <img src="suphoto/colinsu-photo.jpg" class="message-avatar">
        <div class="message-content">
          <div class="message-header">Guan Syun Su</div>
          <div class="message-text">還有建立各種可視化的程式。</div>
        </div>
      </div>

      <div class="message-block delay-4">
        <img src="suphoto/colinsu-photo.jpg" class="message-avatar">
        <div class="message-content">
          <div class="message-header">Guan Syun Su</div>
          <div class="message-text">在下方輸入任何訊息立即加入吧！</div>
        </div>
      </div>

      <div class="chat-input-wrapper">
        <input type="text" id="userInput" class="chat-input" placeholder="說點什麼來加入..." autofocus>
        <button id="sendBtn" class="send-btn">發送</button>
      </div>

    </div>
  </main>

  <script>
    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('userInput');
    const chatArea = document.getElementById('chatArea');
    const DISCORD_LINK = "https://discord.gg/SAXzaDJTTQ";

    function appendMessage(sender, text, isSystem = false) {
      const msg = document.createElement('div');
      msg.className = 'message-block';
      msg.style.opacity = '1';
      msg.style.animation = 'messageSlideIn 0.3s ease-out';
      
      msg.innerHTML = `
        <img src="suphoto/colinsu-photo.jpg" class="message-avatar">
        <div class="message-content">
          <div class="message-header">${sender}</div>
          <div class="message-text">${text}</div>
        </div>
      `;
      
      chatArea.insertBefore(msg, document.querySelector('.chat-input-wrapper'));
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function handleSend() {
      const val = userInput.value.trim();
      if (!val) return;

      // 1. 顯示使用者的訊息
      appendMessage("訪客 (您)", val);
      userInput.value = '';

      // 2. 顯示系統自動回覆
      setTimeout(() => {
        appendMessage("Guan Syun Su (系統)", "正在為您開啟連結，歡迎加入！", true);
      }, 500);

      // 3. 延遲 1.2 秒後在新視窗開啟連結
      setTimeout(() => {
        window.open(DISCORD_LINK, '_blank');
      }, 1200);
    }

    // 事件監聽
    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSend();
    });

    // 處理深色模式
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.documentElement;
      let theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      root.setAttribute('data-theme', theme);
    });
  </script>
</body>
</html>
