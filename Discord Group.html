<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discord Knowledge Base | Guan Syun Su</title>
  
  <style>
    /* --- 核心 CSS 整合 --- */
    :root[data-theme="light"] {
      --primary: #5865F2;
      --background: #f0f2f5;
      --surface: #ffffff;
      --text: #2e3338;
      --card-border: #e3e5e8;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }
    :root[data-theme="dark"] {
      --primary: #5865F2;
      --background: #313338;
      --surface: #2b2d31;
      --text: #dbdee1;
      --card-border: #1e1f22;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    body {
      margin: 0;
      font-family: 'PingFang TC', sans-serif;
      background-color: var(--background);
      color: var(--text);
      transition: background 0.3s;
    }

    .nav {
      background: var(--surface);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
    }

    .brand .name { font-weight: 800; color: var(--primary); }

    .discord-intro-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 24px 150px 24px;
    }

    /* 訊息動畫 */
    @keyframes messageSlideIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .message-block {
      display: flex;
      gap: 16px;
      margin-bottom: 30px;
      opacity: 0; 
      animation: messageSlideIn 0.6s ease-out forwards;
    }

    .delay-1 { animation-delay: 0.2s; }
    .delay-2 { animation-delay: 0.8s; }

    .message-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      flex-shrink: 0;
    }

    .message-content {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 0 16px 16px 16px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
      width: 100%;
    }

    .message-header { font-weight: 800; color: var(--primary); margin-bottom: 4px; }

    /* 底部輸入框 */
    .chat-input-wrapper {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 752px;
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .chat-input {
      flex: 1;
      border: none;
      background: var(--background);
      color: var(--text);
      padding: 12px;
      border-radius: 8px;
      outline: none;
    }

    .send-btn {
      background: #5865F2;
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .send-btn:hover { background: #4752c4; }
  </style>
</head>
<body>

  <header class="nav">
    <div class="container nav-inner">
      <div class="brand"><div class="name">Discord 工作群</div></div>
      <a href="index.html" style="text-decoration:none; color:var(--text)">← 返回首頁</a>
    </div>
  </header>

  <main>
    <div class="discord-intro-container" id="chatArea">
      
      <div class="message-block delay-1">
        <img src="suphoto/colinsu-photo.jpg" class="message-avatar">
        <div class="message-content">
          <div class="message-header">Guan Syun Su</div>
          <div class="message-text">歡迎來到我的頻道！這是一個交流與保存資訊的 Discord 社群。</div>
        </div>
      </div>

       <div class="message-block delay-1">
        <img src="suphoto/colinsu-photo.jpg" class="message-avatar">
        <div class="message-content">
          <div class="message-header">Guan Syun Su</div>
          <div class="message-text">裡面有課程與考試的筆記。</div>
        </div>
      </div>

       <div class="message-block delay-1">
        <img src="suphoto/colinsu-photo.jpg" class="message-avatar">
        <div class="message-content">
          <div class="message-header">Guan Syun Su</div>
          <div class="message-text">還有各種可是化建立的程式。</div>
        </div>
      </div>

      <div class="message-block delay-2">
        <img src="suphoto/colinsu-photo.jpg" class="message-avatar">
        <div class="message-content">
          <div class="message-header">Guan Syun Su</div>
          <div class="message-text">在下方輸入任何訊息立即加入吧!。</div>
        </div>
      </div>

      <div class="chat-input-wrapper">
        <input type="text" id="userInput" class="chat-input" placeholder="說點什麼來加入..." autofocus>
        <button id="sendBtn" class="send-btn">發送並加入</button>
      </div>

    </div>
  </main>

  <script>
    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('userInput');
    const chatArea = document.getElementById('chatArea');
    const DISCORD_LINK = "https://discord.gg/SAXzaDJTTQ";

    function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      // 1. 建立新訊息區塊
      const msg = document.createElement('div');
      msg.className = 'message-block';
      msg.style.opacity = '1';
      msg.style.animation = 'messageSlideIn 0.3s ease-out';
      msg.innerHTML = `
        <img src="suphoto/colinsu-photo.jpg" class="message-avatar">
        <div class="message-content">
          <div class="message-header">訪客 (您)</div>
          <div class="message-text">${text}</div>
        </div>
      `;

      // 2. 插入訊息 (放在輸入框容器之前)
      chatArea.insertBefore(msg, document.querySelector('.chat-input-wrapper'));
      
      // 3. 清空輸入
      userInput.value = '';

      // 4. 滾動到底部
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

      // 5. 延遲 1 秒後開啟新視窗連結
      setTimeout(() => {
        window.open(DISCORD_LINK, '_blank');
      }, 1000);
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // 繼承深色模式設定
    const root = document.documentElement;
    let theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', theme);
  </script>
</body>
</html>
