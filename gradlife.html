<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 星空照片牆 - 質感升級版</title>
    <style>
        /* 基礎重置與背景設定 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a1a 0%, #020205 100%); /* 加上微微的漸層感 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* 優化後的燈箱 (加入毛玻璃模糊特效) */
        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(5, 5, 15, 0.6); /* 降低原本的黑色透明度 */
            backdrop-filter: blur(12px); /* CSS 毛玻璃模糊效果 */
            -webkit-backdrop-filter: blur(12px); /* 支援 Safari */
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.4s ease; /* 讓出現時有淡入效果 */
        }

        #lightbox.active {
            display: flex;
            opacity: 1;
        }

        /* 優化照片邊框與發光感 */
        #lightbox img {
            max-width: 85%;
            max-height: 80%;
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.15), 0 0 15px rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px; /* 微微的圓角更現代 */
            transform: scale(0.95);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 彈性放大動畫 */
        }

        #lightbox.active img {
            transform: scale(1);
        }

        #close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 45px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #close-btn:hover {
            color: #ffffff;
            transform: rotate(90deg) scale(1.1); /* 加上旋轉特效 */
        }
        
        /* 質感提升的提示文字 */
        #hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 4px; /* 增加字距產生電影感 */
            font-size: 0.9rem;
            font-weight: 300;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8); /* 確保在亮色照片前也能看清楚 */
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="hint">探索星空 ‧ 點擊照片瀏覽</div>

    <div id="lightbox">
        <span id="close-btn">&times;</span>
        <img id="enlarged-img" src="" alt="Enlarged Photo">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. 基本設定 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.0015); // 調整迷霧顏色與背景漸層融合

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
        camera.position.z = 0; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // 讓高解析度螢幕(如 Retina)更清晰
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 建立一個宇宙群組，用來包裝「照片」與「星星」，這樣轉動時兩者會一起動
        const universeGroup = new THREE.Group();
        scene.add(universeGroup);

        // --- 2. 建立星空背景 (粒子系統) ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 4000; // 4000 顆星星
        const starPosArray = new Float32Array(starCount * 3);

        for(let i = 0; i < starCount * 3; i++) {
            // 將星星散佈在極大的 3D 空間中
            starPosArray[i] = (Math.random() - 0.5) * 1200; 
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPosArray, 3));
        const starMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 1.2,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true // 讓遠處的星星比較小
        });
        
        const stars = new THREE.Points(starGeometry, starMaterial);
        universeGroup.add(stars); // 將星星加入宇宙群組

        // --- 3. 建立照片 ---
        const textureLoader = new THREE.TextureLoader();
        const photoCount = 120; // 稍微調整數量，讓空間不那麼擁擠

        for (let i = 0; i < photoCount; i++) {
            const imageUrl = `https://picsum.photos/400/300?random=${i}`;
            
            textureLoader.load(imageUrl, (texture) => {
                const geometry = new THREE.PlaneGeometry(16, 12);
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.9 // 讓照片有一點點微透感，融入星空
                });
                const plane = new THREE.Mesh(geometry, material);

                // 隨機分佈照片
                const radius = 120 + Math.random() * 250;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);

                plane.position.x = radius * Math.sin(phi) * Math.cos(theta);
                plane.position.y = radius * Math.sin(phi) * Math.sin(theta);
                plane.position.z = radius * Math.cos(phi);

                plane.lookAt(0, 0, 0);

                // 給照片加一點隨機的自身旋轉，讓它們看起來更自然，不死板
                plane.rotation.z = (Math.random() - 0.5) * 0.2;

                plane.userData = { url: imageUrl }; 
                universeGroup.add(plane); // 將照片加入宇宙群組
            });
        }

        // --- 4. 滑鼠互動 ---
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        // --- 5. 光線投射 (點擊放大) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const lightbox = document.getElementById('lightbox');

        document.addEventListener('click', (event) => {
            // 如果點擊到了關閉按鈕或是燈箱背景，就不執行射線計算
            if(event.target.id === 'close-btn' || event.target.id === 'lightbox') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            // 這裡要注意：我們現在要檢查的是 universeGroup 裡面的所有物件 (包含照片和星星)
            // 所以要過濾出我們有點擊到網址的照片物件
            const intersects = raycaster.intersectObjects(universeGroup.children);

            for (let i = 0; i < intersects.length; i++) {
                if (intersects[i].object.userData.url) {
                    const highResUrl = intersects[i].object.userData.url;
                    document.getElementById('enlarged-img').src = highResUrl;
                    
                    // 使用 class 來控制淡入動畫
                    lightbox.style.display = 'flex';
                    // 稍微延遲加上 active class 來觸發 CSS 動畫
                    setTimeout(() => lightbox.classList.add('active'), 10);
                    break; // 找到第一張有網址的照片就停止
                }
            }
        });

        // --- 6. 關閉燈箱 ---
        document.getElementById('close-btn').addEventListener('click', () => {
            lightbox.classList.remove('active');
            // 等待淡出動畫(0.4s)結束後，再真正隱藏元素
            setTimeout(() => lightbox.style.display = 'none', 400);
        });

        // 點擊燈箱背景也可以關閉
        lightbox.addEventListener('click', (e) => {
            if(e.target === lightbox) {
                lightbox.classList.remove('active');
                setTimeout(() => lightbox.style.display = 'none', 400);
            }
        });

        // --- 7. 動畫迴圈 ---
        function animate() {
            requestAnimationFrame(animate);

            targetX = mouseX * 0.0008;
            targetY = mouseY * 0.0008;

            // 讓宇宙群組平滑跟隨滑鼠
            universeGroup.rotation.y += 0.05 * (targetX - universeGroup.rotation.y);
            universeGroup.rotation.x += 0.05 * (targetY - universeGroup.rotation.x);

            // 【增加生命力】加入緩慢的自動旋轉，即使不動滑鼠星空也會轉
            universeGroup.rotation.y -= 0.0005;

            renderer.render(scene, camera);
        }
        animate();

        // --- 8. 視窗大小調整 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
