<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 星空照片牆</title>
    <style>
        /* 重置預設邊距，隱藏捲軸，設定背景為黑色星空感 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050510;
        }

        /* 畫布容器 */
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* 放大照片的燈箱 (預設隱藏) */
        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* 放大後的照片圖片 */
        #lightbox img {
            max-width: 90%;
            max-height: 80%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 4px;
        }

        /* 關閉按鈕 */
        #close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        #close-btn:hover {
            color: #ff5555;
            transform: scale(1.1);
        }
        
        /* 提示文字 */
        #hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="hint">移動滑鼠轉動星空，點擊照片放大瀏覽</div>

    <div id="lightbox">
        <span id="close-btn">&times;</span>
        <img id="enlarged-img" src="" alt="Enlarged Photo">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. 基本設定 (場景、相機、渲染器) ---
        const scene = new THREE.Scene();
        // 增加一點迷霧效果，讓遠處的照片變暗，增加星空深邃感
        scene.fog = new THREE.FogExp2(0x050510, 0.002); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 0; // 相機放在中心點

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- 2. 建立照片群組與星空 ---
        const photoGroup = new THREE.Group();
        scene.add(photoGroup);

        const textureLoader = new THREE.TextureLoader();
        const photoCount = 150; // 你想要的照片數量

        // 隨機生成照片
        for (let i = 0; i < photoCount; i++) {
            // 使用 Picsum 產生隨機圖片 (開發測試用)
            // 未來你可以改成你自己的陣列，例如：const myImages = ['img1.jpg', 'img2.jpg'...];
            const imageUrl = `https://picsum.photos/400/300?random=${i}`;
            
            // 載入圖片並建立 3D 平面
            textureLoader.load(imageUrl, (texture) => {
                const geometry = new THREE.PlaneGeometry(16, 12); // 照片的長寬比例
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    side: THREE.DoubleSide, // 讓正反面都看得到
                    transparent: true
                });
                const plane = new THREE.Mesh(geometry, material);

                // 將照片隨機散佈在一個球體空間中 (半徑約為 100 到 300 之間)
                const radius = 100 + Math.random() * 200;
                const theta = Math.random() * Math.PI * 2; // 水平角度
                const phi = Math.acos(Math.random() * 2 - 1); // 垂直角度

                plane.position.x = radius * Math.sin(phi) * Math.cos(theta);
                plane.position.y = radius * Math.sin(phi) * Math.sin(theta);
                plane.position.z = radius * Math.cos(phi);

                // 讓照片永遠面向中心點 (相機位置)
                plane.lookAt(0, 0, 0);

                // 將圖片網址儲存在物件中，方便點擊時取得
                plane.userData = { url: imageUrl }; 

                photoGroup.add(plane);
            });
        }

        // --- 3. 滑鼠互動 (轉動星空) ---
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            // 將滑鼠座標轉換為 -1 到 1 的比例
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        // --- 4. 滑鼠點擊 (Raycaster 光線投射) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        document.addEventListener('click', (event) => {
            // 計算正規化的滑鼠座標 (-1 到 +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // 透過相機和滑鼠位置發射光線
            raycaster.setFromCamera(mouse, camera);

            // 計算光線交會到的物件 (我們的照片群組)
            const intersects = raycaster.intersectObjects(photoGroup.children);

            if (intersects.length > 0) {
                // 如果點到了照片，取得該照片的網址
                const clickedPhoto = intersects[0].object;
                const highResUrl = clickedPhoto.userData.url; // 這裡可以換成更高畫質的圖片網址

                // 顯示燈箱
                const lightbox = document.getElementById('lightbox');
                const enlargedImg = document.getElementById('enlarged-img');
                enlargedImg.src = highResUrl;
                lightbox.style.display = 'flex';
            }
        });

        // --- 5. 關閉燈箱 ---
        document.getElementById('close-btn').addEventListener('click', () => {
            document.getElementById('lightbox').style.display = 'none';
        });

        // --- 6. 動畫迴圈 ---
        function animate() {
            requestAnimationFrame(animate);

            // 平滑計算目標旋轉角度 (加入一點阻尼感，讓轉動更柔和)
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;

            // 讓整個照片群組跟著滑鼠緩慢旋轉
            photoGroup.rotation.y += 0.05 * (targetX - photoGroup.rotation.y);
            photoGroup.rotation.x += 0.05 * (targetY - photoGroup.rotation.x);

            renderer.render(scene, camera);
        }
        animate();

        // --- 7. 視窗大小調整 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
