<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 星空照片牆 - 速度調整版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a1a 0%, #020205 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; 
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(5, 5, 15, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #lightbox.active {
            display: flex;
            opacity: 1;
        }

        #lightbox img {
            max-width: 85%;
            max-height: 80%;
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.15), 0 0 15px rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            transform: scale(0.95);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #lightbox.active img {
            transform: scale(1);
        }

        #close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 45px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #close-btn:hover {
            color: #ffffff;
            transform: rotate(90deg) scale(1.1);
        }
        
        #hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 4px;
            font-size: 0.9rem;
            font-weight: 300;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="hint">按住左鍵拖曳轉動星空 ‧ 點擊照片瀏覽</div>

    <div id="lightbox">
        <span id="close-btn">&times;</span>
        <img id="enlarged-img" src="" alt="Enlarged Photo">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. 基本設定 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.0015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
        camera.position.z = 0; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const universeGroup = new THREE.Group();
        scene.add(universeGroup);

        // --- 2. 建立星空背景 ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 4000;
        const starPosArray = new Float32Array(starCount * 3);
        for(let i = 0; i < starCount * 3; i++) {
            starPosArray[i] = (Math.random() - 0.5) * 1200; 
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPosArray, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, transparent: true, opacity: 0.8 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        universeGroup.add(stars);

        // --- 3. 匯入你自己的照片 ---
        const myImages = [
            'photo1.jpg',
            'photo2.jpg',
            'photo3.jpg',
        ];
        
        const textureLoader = new THREE.TextureLoader();
        const totalPhotosNeeded = 80; 

        for (let i = 0; i < totalPhotosNeeded; i++) {
            const imageUrl = myImages[i % myImages.length]; 
            
            textureLoader.load(imageUrl, (texture) => {
                const geometry = new THREE.PlaneGeometry(16, 12);
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.9 
                });
                const plane = new THREE.Mesh(geometry, material);

                const radius = 120 + Math.random() * 250;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);

                plane.position.x = radius * Math.sin(phi) * Math.cos(theta);
                plane.position.y = radius * Math.sin(phi) * Math.sin(theta);
                plane.position.z = radius * Math.cos(phi);
                plane.lookAt(0, 0, 0);
                plane.rotation.z = (Math.random() - 0.5) * 0.2;

                plane.userData = { url: imageUrl }; 
                universeGroup.add(plane);
            }, undefined, function (err) {
                console.warn('無法載入圖片:', imageUrl);
            });
        }

        // --- 4. 滑鼠拖曳互動 (新增速度控制變數) ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let startPoint = { x: 0, y: 0 }; 
        let targetRotationX = 0;
        let targetRotationY = 0;

        // 【這裡可以調整拖動速度！】
        // 預設是 0.003。如果你覺得太快，可以改成 0.001；如果覺得太慢，可以改成 0.008。
        const dragSpeed = 0.003; 

        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            startPoint = { x: e.clientX, y: e.clientY }; 
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaMove = {
                    x: e.clientX - previousMousePosition.x,
                    y: e.clientY - previousMousePosition.y
                };

                // 套用我們設定的速度變數
                targetRotationY -= deltaMove.x * dragSpeed;
                targetRotationX -= deltaMove.y * dragSpeed;

                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // --- 5. 光線投射 (點擊放大) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const lightbox = document.getElementById('lightbox');

        document.addEventListener('click', (event) => {
            if(event.target.id === 'close-btn' || event.target.id === 'lightbox') return;

            const moveDistance = Math.sqrt(Math.pow(event.clientX - startPoint.x, 2) + Math.pow(event.clientY - startPoint.y, 2));
            if (moveDistance > 5) {
                return; 
            }

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(universeGroup.children);

            for (let i = 0; i < intersects.length; i++) {
                if (intersects[i].object.userData.url) {
                    const highResUrl = intersects[i].object.userData.url;
                    document.getElementById('enlarged-img').src = highResUrl;
                    
                    lightbox.style.display = 'flex';
                    setTimeout(() => lightbox.classList.add('active'), 10);
                    break; 
                }
            }
        });

        // --- 6. 關閉燈箱 ---
        document.getElementById('close-btn').addEventListener('click', () => {
            lightbox.classList.remove('active');
            setTimeout(() => lightbox.style.display = 'none', 400);
        });
        lightbox.addEventListener('click', (e) => {
            if(e.target === lightbox) {
                lightbox.classList.remove('active');
                setTimeout(() => lightbox.style.display = 'none', 400);
            }
        });

        // --- 7. 動畫迴圈 ---
        function animate() {
            requestAnimationFrame(animate);

            universeGroup.rotation.y += (targetRotationY - universeGroup.rotation.y) * 0.1;
            universeGroup.rotation.x += (targetRotationX - universeGroup.rotation.x) * 0.1;

            targetRotationY += 0.0005; // 微小的自動旋轉

            renderer.render(scene, camera);
        }
        animate();

        // --- 8. 視窗大小調整 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
